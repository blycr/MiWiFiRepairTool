[workspace]
resolver = "2"
members = ["crates/core", "crates/selftest", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "EUPL-1.1"

[workspace.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
ureq = "2.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[profile.release]
opt-level = "s"
strip = true
lto = "thin"
